services:

  # Database service: stores all WordPress data in MariaDB.
  mariadb:
    build:
      context: ./requirements/mariadb
      dockerfile: Dockerfile
    image: mariadb:inception
    container_name: mariadb
    restart: unless-stopped
    env_file:
      - .env
    # Docker secrets keep database passwords outside the Compose file.
    secrets:
      - db_password
      - db_root_password
    # Persistent MariaDB data is stored on the host.
    volumes:
      - mariadb_data:/var/lib/mysql
    # All services communicate through the private Docker network.
    networks:
      - inception

  # WordPress service: runs PHP-FPM and communicates with MariaDB.
  wordpress:
    build:
      context: ./requirements/wordpress
      dockerfile: Dockerfile
    image: wordpress:inception
    container_name: wordpress
    restart: unless-stopped
    env_file:
      - .env
    secrets:
      - db_password
      - wp_admin_password
      - wp_user_password
    # Persistent WordPress files are stored on the host.
    volumes:
      - wordpress_data:/var/www/html
    networks:
      - inception
    depends_on:
      - mariadb

  # NGINX is the only service exposed to the host.
  nginx:
    build:
      context: ./requirements/nginx
      dockerfile: Dockerfile
    image: nginx:inception
    container_name: nginx
    restart: unless-stopped
    env_file:
      - .env
    # NGINX serves the same persistent WordPress files.
    volumes:
      - wordpress_data:/var/www/html
    # Only HTTPS is exposed to the host.
    ports:
      - "443:443"
    networks:
      - inception
    depends_on:
      - wordpress

# Docker secrets are provided as files and are not stored in the Compose file.
secrets:
  db_password:
    file: ../secrets/db_password.txt

  db_root_password:
    file: ../secrets/db_root_password.txt

  wp_admin_password:
    file: ../secrets/wp_admin_password.txt

  wp_user_password:
    file: ../secrets/wp_user_password.txt

# Persistent volumes backed by directories on the host.
volumes:
  # MariaDB persistent data: /home/carmelag/data/mariadb
  mariadb_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/carmelag/data/mariadb

  # WordPress persistent data: /home/carmelag/data/wordpress
  wordpress_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/carmelag/data/wordpress

# Private bridge network used for communication between the three services.
networks:
  inception:
    driver: bridge
